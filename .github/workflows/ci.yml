name: Source checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PGRAZOR_BUILD_TOOLS: 36.0.0
      PGRAZOR_ANDROID_PLATFORM: android-36
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Install Android SDK
        shell: pwsh
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "sources;android-36"
      - name: Prepare pinned DEX test dependencies
        run: python -c "import sys; sys.path.insert(0, 'pgrazor'); import dex_bridges; dex_bridges.dependencies(download=True)"
      - run: python -B tools/check.py
      - name: Compile Android controls (not a playable game build)
        run: python -B pgrazor/build.py
      - name: Package source and tools only
        run: python -B tools/source_bundle.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: PGRazor-source-tools
          path: dist/PGRazor-source-tools.zip
          if-no-files-found: error
          retention-days: 14
